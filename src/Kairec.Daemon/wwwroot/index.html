<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kairec</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">kairec</div>
  <div id="status" class="status idle">idle</div>
  <div class="spacer"></div>
  <button id="markBtn" class="btn" title="M">● Mark</button>
</header>

<div class="layout">
  <aside>
    <div class="tabs">
      <button class="tab active" data-tab="sessions">Sessions</button>
      <button class="tab" data-tab="clips">Clips</button>
      <select id="profileFilter" title="profile"><option value="">all profiles</option></select>
    </div>
    <div id="list" class="list"></div>
  </aside>

  <main>
    <div id="empty" class="empty">Pick a session or clip on the left.</div>
    <div id="viewer" hidden>
      <div class="titlebar">
        <div id="title" class="title"></div>
        <div id="subtitle" class="subtitle"></div>
      </div>
      <div class="player">
        <video id="video" controls preload="metadata"></video>
      </div>

      <div id="timeline" class="timeline">
        <div id="tlPurged" class="tl-purged"></div>
        <div id="tlWindow" class="tl-window"></div>
        <div id="tlSel" class="tl-sel"></div>
        <div id="tlMarkers"></div>
        <div id="tlHead" class="tl-head"></div>
        <div id="tlTip" class="tl-tip"></div>
      </div>
      <div class="tl-legend" id="legend"></div>

      <div class="controls">
        <div class="group">
          <span class="time" id="curTime">0:00</span>
          <button class="btn small" id="inBtn" title="I">Set in</button>
          <input id="inVal" class="num" type="number" step="0.1" min="0">
          <button class="btn small" id="outBtn" title="O">Set out</button>
          <input id="outVal" class="num" type="number" step="0.1" min="0">
          <input id="exportLabel" class="text" placeholder="label">
          <label class="chk"><input type="checkbox" id="exact"> frame-exact (re-encode)</label>
          <button class="btn primary" id="exportBtn">Export range</button>
        </div>
        <div class="group">
          <span class="muted">around marker:</span>
          <input id="before" class="num" type="number" value="10" min="0"> s before
          <input id="after" class="num" type="number" value="5" min="0"> s after
          <span class="muted">· batch:</span>
          <select id="batchType"></select>
          <button class="btn small" id="batchBtn">Export all</button>
        </div>
      </div>
    </div>
  </main>

  <section id="markersPane" class="markers">
    <div class="pane-head">
      <span>Markers</span>
      <select id="typeFilter"><option value="">all</option></select>
    </div>
    <div id="markerList"></div>
  </section>
</div>

<div id="toast" class="toast" hidden></div>
<script src="hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
