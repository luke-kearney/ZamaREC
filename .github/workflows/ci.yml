name: ci
# Feature branches go into develop by pull request, develop goes into master by pull request.
# Every pull request is built and tested. A push to develop replaces the "dev" pre-release,
# a push to master publishes a release of its own.
on:
  push:
    branches: [master, develop]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test tests/ZamaRec.Tests --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: publish CLI (NativeAOT smoke)
        run: |
          sudo apt-get install -y clang zlib1g-dev >/dev/null
          dotnet publish src/ZamaRec.Cli -c Release -r linux-x64 -o /tmp/cli --nologo -v q
          /tmp/cli/zamarec --help | head -3

  windows-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: cache ffmpeg download
        uses: actions/cache@v4
        with:
          path: ~/.cache/zamarec
          key: ffmpeg-essentials-${{ hashFiles('packaging/windows/build.sh') }}
      - name: build the Windows bundle (cross-published from Linux)
        run: packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zamarec-windows-x64-${{ github.sha }}
          path: dist/windows/zamarec-windows-x64.zip
          if-no-files-found: error

  # Only after both jobs above passed, and never for a pull request.
  release:
    if: github.event_name == 'push'
    needs: [build, windows-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zamarec-windows-x64-${{ github.sha }}
      - name: develop -> the "dev" pre-release, replaced each time
        if: github.ref == 'refs/heads/develop'
        run: |
          gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          gh release create dev zamarec-windows-x64.zip --prerelease --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "The newest build of the develop branch, replaced on every push. Built from $GITHUB_SHA on $(date -u +%Y-%m-%d\ %H:%M) UTC."
      - name: master -> a release of its own
        if: github.ref == 'refs/heads/master'
        run: |
          tag="v$(date -u +%Y.%m.%d)-$GITHUB_RUN_NUMBER"
          gh release create "$tag" zamarec-windows-x64.zip --latest --target "$GITHUB_SHA" --title "ZamaREC $tag" --generate-notes
